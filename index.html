<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <title>Do you like me???</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Pacifico', cursive;
}

body {
  background-color: #ffe6f0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 1rem;
  text-align: center;
  gap: 1rem;
}

.marquee {
  position: absolute;
  top: 5%;
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  z-index: 5;
}

.marquee span {
  display: inline-block;
  font-size: 2em;
  font-weight:200;
  color: #ff1493,#2578C7;
  padding-left: 100%;
  animation: marquee 12s linear infinite;
}

@keyframes marquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
h1 {
  color: #ff3399;
  font-size: 2rem;
  min-height: 2em;
}

img {
  width: 60vw;
  max-width: 250px;
  height: auto;
  border-radius: 20px;
  transition: 0.3s;
}

.button-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.btn {
  font-size: 1rem;
  padding: 0.7rem 1.5rem;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.btn-yes {
  background-color: #66ff99;
  color: #006600;
}

.btn-no {
  background-color: #ff6666;
  color: #800000;
}

.btn:hover {
  transform: scale(1.1);
}

.emoji-effect {
  position: fixed;
  animation: popFade 1s ease-out forwards;
  pointer-events: none;
  user-select: none;
  z-index: 9999;
}

@keyframes popFade {
  0% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  50% {
    transform: scale(1.5) translateY(-30px);
    opacity: 0.7;
  }
  100% {
    transform: scale(0.5) translateY(-60px);
    opacity: 0;
  }
}

@media (max-width: 600px) {
  h1 {
    font-size: 1.5rem;
  }
  .btn {
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
  }
}

@keyframes shakeHard {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

.shake {
  animation: shakeHard 0.6s ease;
}
  </style>
</head>
<body>
  <div class="marquee">
  <span>@with_codecrafter</span>
</div>
  <img id="gif" src="https://i.pinimg.com/originals/01/df/7f/01df7f2337097617c8e34c15802b077f.gif" alt="Cute GIF"/>
  <h1 id="question">Do you like me??</h1>

  <div class="button-group">
    <button id="yesBtn" class="btn btn-yes">Yes</button>
    <button id="noBtn" class="btn btn-no">No</button>
  </div>

  <audio id="bg-music1">
    <source src="No01.mp3" type="audio/mpeg" />
  </audio>
  <audio id="bg-music2">
    <source src="Huh02.mp3" type="audio/mpeg" />
  </audio>
  <audio id="bg-music3">
    <source src="Quack03.mp3" type="audio/mpeg" />
  </audio>
  <audio id="bg-music4">
    <source src="song1.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const gif = document.getElementById('gif');
const question = document.getElementById('question');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const sound1 = document.getElementById('bg-music1');
const sound2 = document.getElementById('bg-music2');
const sound3 = document.getElementById('bg-music3');
const sound4 = document.getElementById('bg-music4');

const content = [
  { gif: 'https://i.pinimg.com/originals/7a/ef/73/7aef734a86dce4dc206976d4f0586f2c.gif', message: 'Are you sure? 😢' },
  { gif: 'https://i.pinimg.com/originals/c8/07/e2/c807e26d8aed392f172f0bf441f60626.gif', message: 'Try thinking again 🥺' },
  { gif: 'https://i.pinimg.com/originals/0d/ac/7e/0dac7e14010362ff081e2167be218341.gif', message: 'Please, give me a chance.💔' },
  { gif: 'https://i.pinimg.com/originals/88/e7/86/88e786492cc527584feee199936813dd.gif', message: 'Is that really bad? 😭' },
  { gif: 'https://i.pinimg.com/originals/82/be/ae/82beaeb21c686871437f88bbc1593288.gif', message: ' Just one more time, please 🥺 '},
  { gif: 'https://i.pinimg.com/originals/97/91/de/9791de11497556c4a5e800427c48fc47.gif', message: 'I am so sad.. 😔' },
];

let clickCount = 0;

noBtn.addEventListener('click', () => {
  const index = clickCount % content.length;
  gif.src = content[index].gif;
  question.textContent = content[index].message;
  clickCount++;

  if (clickCount === 3) {
    noBtn.textContent = 'Click Yes to print 😭';
  } else if (clickCount === 7) {
    noBtn.textContent = 'Please click Yes 😭';
  }

  if (clickCount <= 5) {
    sound1.play(); 
  } else if (clickCount <= 8) {
    sound2.play(); 
  }else{
    sound3.play();
  }

  const emoji = document.createElement('div');
  emoji.textContent = '😭';
  emoji.classList.add('emoji-effect');

  const rect = noBtn.getBoundingClientRect();
  const scrollY = window.scrollY || window.pageYOffset;
  emoji.style.left = `${rect.left + rect.width / 2}px`;
  emoji.style.top = `${rect.top + scrollY}px`;

  document.body.appendChild(emoji);

  setTimeout(() => emoji.remove(), 1000);

  // Thêm class shake
  noBtn.classList.add('shake');

  // Gỡ class sau khi animation kết thúc để có thể lặp lại lần sau
  setTimeout(() => noBtn.classList.remove('shake'), 600);

});

yesBtn.addEventListener('click', () => {
  question.textContent = 'I know! you like me too🌺.  He he I was waiting for this answer  🫣❤️';
  gif.src = 'https://i.pinimg.com/originals/7e/f6/9c/7ef69cd0a6b0b78526c8ce983b3296fc.gif';
  noBtn.style.display = 'none';
  yesBtn.style.display = 'none';
  explodeHearts();
  sound4.currentTime = 103.5;
  sound4.play();
});

function explodeHearts() {
  for (let i = 0; i < 20; i++) {
    const heart = document.createElement('div');
    const icons = ['❤️', '💖'];
    heart.textContent = icons[Math.floor(Math.random() * icons.length)];
    heart.classList.add('emoji-effect');

    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;

    heart.style.left = `${x}px`;
    heart.style.top = `${y}px`; // Không cộng scrollY nữa
    heart.style.fontSize = `${Math.random() * 1.5 + 1}rem`;

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  }

  setTimeout(explodeHearts, 500);
}

  </script>
</body>
</html>
